[tool.poetry]
name = "ms_seg"
version = "0.1.0"
description = "Multiple Sclerosis Lesion Segmentation Project"
authors = ["or.livne@themavens.com"]
readme = "README.md"
packages = [{include = "ms_seg", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"

# ============================================================
# CORE DATA STACK
# ============================================================
numpy = "^2.0.0"
pandas = "^2.2.0"
scipy = "^1.15.0"

# ============================================================
# MEDICAL IMAGE PROCESSING
# ============================================================
nibabel = "^5.3.0"
scikit-image = "^0.25.0"
opencv-python = "^4.11.0"

# ============================================================
# PLOTTING & VISUALIZATION
# ============================================================
matplotlib = "^3.10.0"
plotly = "^6.1.2"
ipywidgets = "^8.1.5"

# ============================================================
# UTILITIES
# ============================================================
tqdm = "^4.67.1"
joblib = "^1.4.2"
python-dateutil = "^2.9.0"

# ============================================================
# NOTEBOOK & DEVELOPMENT
# ============================================================
jupyter = "^1.1.1"
ipykernel = "^7.1.0"
monai = "^1.5.2"
scikit-learn = "^1.8.0"

[tool.poetry.group.dev.dependencies]
jupytext = "^1.19.1"
pytest = "^8.3.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
